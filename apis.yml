name: Combinatorx
description: 'CombinatoRx, Inc. was a Cambridge/Boston, Massachusetts biopharmaceutical company (SEC
  CIK 0001135906, SIC 2834 Pharmaceutical Preparations, incorporated in Delaware) that pursued
  combination drug discovery — screening pairs of approved drugs for synergistic therapeutic effects.
  It registered with the SEC in 2002 and traded publicly following its 2005 IPO. The company was
  renamed Zalicus Inc. in September 2010 after its combination with Neuromed Pharmaceuticals, and
  renamed again to EPIRUS Biopharmaceuticals, Inc. in July 2014 after merging with EPIRUS. EPIRUS was
  delisted in September 2016 (Form 25-NSE) and its SEC registration was formally revoked on
  2024-05-14. The company is defunct: it operated no developer program and published no public API,
  SDK, or developer documentation, and combinatorx.com is now a parked NameBright listing unrelated
  to the original company. This profile is retained as a historical record of a Canaan Partners
  portfolio company and has no API surface to catalog.'
